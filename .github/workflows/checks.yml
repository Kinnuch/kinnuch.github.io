name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      # Catches case mismatches and Unicode-normalisation drift in paths.
      # The runner is case-sensitive, like GitHub Pages and unlike Windows.
      - name: Link check
        run: python script/linkcheck.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JavaScript syntax check
        run: |
          set -euo pipefail
          fail=0
          for f in assets/js/*.js; do
            case "$f" in *"/vendor/"*|*.min.js) continue;; esac
            node --check "$f" || { echo "SYNTAX ERROR: $f"; fail=1; }
          done
          exit $fail

      - name: Validate YAML and JSON
        run: |
          python - <<'PY'
          import glob, json, sys, yaml
          bad = 0
          for f in ['_config.yml', '_config.dev.yml'] + glob.glob('_data/*.yml'):
              try:
                  yaml.safe_load(open(f, encoding='utf-8').read())
              except Exception as e:
                  print('FAIL', f, e); bad = 1
          for f in ['assets/data/commits.json',
                    'laim/sindarin.assets/SindarinDatabase/dictionary.json',
                    'laim/shikrin.assets/ShikrinDatabase/dictionary.json']:
              try:
                  json.load(open(f, encoding='utf-8'))
              except Exception as e:
                  print('FAIL', f, e); bad = 1
          sys.exit(bad)
          PY

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      # Proves the Liquid in search.json / sitemap.xml / feed.xml and the
      # _data-driven pages actually renders before it reaches production.
      - name: Jekyll build
        run: bundle exec jekyll build --trace

      - name: Assert generated files exist and parse
        run: |
          set -euo pipefail
          for f in _site/search.json _site/sitemap.xml _site/robots.txt _site/feed.xml _site/404.html; do
            test -s "$f" || { echo "MISSING or EMPTY: $f"; exit 1; }
            echo "ok $f ($(wc -c < "$f") bytes)"
          done
          python3 -c "import json,sys; d=json.load(open('_site/search.json',encoding='utf-8')); print('search index:', len(d), 'pages'); sys.exit(0 if d else 1)"
          python3 -c "import xml.dom.minidom as m; m.parse('_site/sitemap.xml'); m.parse('_site/feed.xml'); print('sitemap + feed are well-formed XML')"
