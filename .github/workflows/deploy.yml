name: Build and deploy

# Replaces both the old "Build commits.json" workflow and the separate
# "Checks" workflow.
#
# The old setup had GitHub Pages build straight from the branch, which meant
# assets/data/commits.json had to be generated by a workflow and *committed
# back* — one bot commit per push, forever. Here the site is built in the
# runner instead, so commits.json is generated into _site at build time and
# never touches the repository.
#
# Requires: Settings -> Pages -> Source = "GitHub Actions".
# While the source is still "Deploy from a branch", this workflow runs fine
# but the deploy step fails; nothing else breaks.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- verify --
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet pyyaml

      # Catches case mismatches and Unicode normalisation drift in paths.
      # The runner is case-sensitive, like Pages and unlike Windows.
      - name: Link check
        run: python script/linkcheck.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JavaScript syntax check
        run: |
          set -euo pipefail
          fail=0
          for f in assets/js/*.js; do
            case "$f" in *"/vendor/"*|*.min.js) continue;; esac
            node --check "$f" || { echo "SYNTAX ERROR: $f"; fail=1; }
          done
          exit $fail

      - name: Validate YAML and JSON
        run: |
          python - <<'PY'
          import glob, json, sys, yaml
          bad = 0
          for f in ['_config.yml', '_config.dev.yml'] + glob.glob('_data/*.yml'):
              try:
                  yaml.safe_load(open(f, encoding='utf-8').read())
              except Exception as e:
                  print('FAIL', f, e); bad = 1
          for f in ['laim/sindarin.assets/SindarinDatabase/dictionary.json',
                    'laim/shikrin.assets/ShikrinDatabase/dictionary.json']:
              try:
                  json.load(open(f, encoding='utf-8'))
              except Exception as e:
                  print('FAIL', f, e); bad = 1
          sys.exit(bad)
          PY

  # ----------------------------------------------------------------- build --
  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      # Full history: the commits.json step below reads the whole git log.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Generated into the working tree so Jekyll copies it into _site.
      # It is never added or committed — that is the whole point of this
      # workflow. The tracked copy in the repo stays as a snapshot so local
      # `jekyll serve` still has data to render.
      - name: Generate commits.json
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/data
          # Tab-separated; jq splits on real tabs. Tabs in commit subjects are
          # rare enough we accept the trade for shell simplicity.
          # Drop %x09%an from the format below to stop publishing the git
          # author name — nothing on the site renders it.
          git log --no-merges --date=iso-strict \
            --pretty=format:'%H%x09%h%x09%cI%x09%an%x09%s' \
            | jq -R -s '
                split("\n")
                | map(select(length > 0))
                | map(split("\t"))
                | map({
                    hash: .[0],
                    short: .[1],
                    date: .[2],
                    author: .[3],
                    msg: (.[4:] | join("\t"))
                  })
              ' > assets/data/commits.json
          echo "Wrote $(jq length assets/data/commits.json) commits"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - uses: actions/configure-pages@v5

      - name: Jekyll build
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace

      # A green build is not proof the generated files are usable.
      - name: Assert generated files
        shell: bash
        run: |
          set -euo pipefail
          for f in _site/search.json _site/sitemap.xml _site/robots.txt \
                   _site/feed.xml _site/404.html _site/CNAME \
                   _site/assets/data/commits.json; do
            test -s "$f" || { echo "MISSING or EMPTY: $f"; exit 1; }
            echo "ok $f ($(wc -c < "$f") bytes)"
          done
          python3 - <<'PY'
          import json, sys, xml.dom.minidom as minidom
          idx = json.load(open('_site/search.json', encoding='utf-8'))
          print('search index:', len(idx), 'pages')
          if not idx:
              sys.exit('search index is empty')
          leaked = [p['t'] for p in idx if '{%' in p['b'] or '{{' in p['b']]
          if leaked:
              sys.exit('unrendered Liquid in search index: %s' % leaked)
          commits = json.load(open('_site/assets/data/commits.json', encoding='utf-8'))
          print('commits.json:', len(commits), 'entries')
          if not commits:
              sys.exit('commits.json is empty')
          minidom.parse('_site/sitemap.xml')
          minidom.parse('_site/feed.xml')
          print('sitemap + feed are well-formed XML')
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  # ---------------------------------------------------------------- deploy --
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
