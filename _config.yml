# http://en.wikipedia.org/wiki/List_of_tz_database_time_zones
# Must be a real IANA identifier. "China/Beijing" is not one: on Linux an
# invalid TZ silently falls back to UTC (so site.time was an hour-offset wrong
# in production), and on Windows Jekyll validates it through tzinfo and aborts
# the build outright.
timezone: Asia/Shanghai
future: true
highlighter: rouge
# markdown: kramdown
# markdown: redcarpet
# pygments: true


# https://github.com/mojombo/jekyll/wiki/Permalinks
permalink:   /:categories/:title


kramdown:
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  enable_coderay: false

  # coderay:
  #   coderay_line_numbers:
  #   coderay_line_numbers_start: 1
  #   coderay_tab_width: 4
  #   coderay_bold_every: 10
  #   coderay_css: class


# giscus (GitHub Discussions) comment settings.
# Fill repo_id and category_id from https://giscus.app after enabling
# Discussions on the repo and installing the giscus GitHub App.
giscus:
  repo: Kinnuch/kinnuch.github.io
  repo_id: "R_kgDOLcXysA"
  category: Comments
  category_id: "DIC_kwDOLcXysM4C-EO1"
  mapping: pathname
  strict: "0"
  reactions_enabled: "1"
  emit_metadata: "1"
  input_position: top
  theme_light: light
  theme_dark: dark_dimmed
  lang: zh-CN
  loading: lazy

include: [".htaccess"]

# NOTE: a custom `exclude:` REPLACES Jekyll's built-in default list rather than
# extending it, so the Bundler/Ruby entries below must be spelled out. Without
# them a local `bundle install --path vendor/bundle` makes Jekyll try to render
# the gems' own site templates and the build dies.
exclude:
  - lib
  - config.rb
  - Capfile
  - config
  - log
  - Rakefile
  - Rakefile.rb
  - tmp
  - less
  - minimal-mistakes.sublime-project
  - minimal-mistakes.sublime-workspace
  # Bundler / Ruby
  - Gemfile
  - Gemfile.lock
  - .bundle
  - vendor
  - script
  # Build artefacts that should never be published
  - laim/quenya.assets/QuenyaChecker/build
  - node_modules