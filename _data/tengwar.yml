    ipa: "x"
    tengwa: ""
    certh: ""
  - latin: dh
    ipa: "ð"
    tengwa: ""
    certh: ""
  - latin: lh
    ipa: "ɬ"
    tengwa: ""
    certh: ""
  - latin: mh
    ipa: "v"
    tengwa: ""
    certh: ""
  - latin: ng
    ipa: "ŋ"
    tengwa: ""
    certh: ""
  - latin: ph
    ipa: "f"
    tengwa: ""
    certh: ""
  - latin: rh
