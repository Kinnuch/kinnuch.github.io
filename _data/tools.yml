# Single source of truth for the Cerf (工具) section — cerf.md renders from this.
# section: 分组标题（辛达语 | 中文）
# new: true 会显示 NEW 角标

- section: Qonlang | 千语集
  items:
    - title: Qonlang · 千语集
      zh: 给所有造语者的桌面工作台
      url: /cerf/qonlang/
      new: true
      blurb: 录入词汇与词根、制订音变规则、按音系自动标音、自动 gloss 例句、自定义文字与皮肤、导出词典与 PDF。不内置任何一门语言的术语，一切分类由你定义。Windows 免安装版与安装包见 GitHub，本页为分模块使用指南。

- section: 背单词
  items:
    - title: Wordbank · 单词本
      zh: 离线背英语单词的手机应用
      url: /cerf/wordbank/
      new: true
      blurb: 粘贴一列单词、导入扇贝或欧路的词表、选一本内置词书，或手动加词，都能几秒钟开背。没写释义的词会自动从内置离线词典补上音标、词性释义和例句 —— 19,870 个单词加 52,061 条短语，`give up`、`in spite of` 这类也查得到，`gave up` 会认出原形。复习按 SM-2 间隔重复排期（前五次走 1/2/4/7/15 天的固定阶梯），出题在认词义、选单词、拼写、例句填空、听音辨义之间轮换，答错的词当场重来。抽查不会打乱排期。数据只存在本机，可导出备份。安卓 Chrome 里「添加到主屏幕」后有独立图标、全屏、完全离线。

- section: Prestannath | 音变器
  items:
    - title: Shikrin SCA
      zh: 希克林语系音变器（网页版）
      url: /laim/shikrin.assets/SCA/SCA.html
      blurb: 内置「瑟乌丝林语」与「群岛希克林语」两种预设的 Category / Replace / Rule，也可自定义规则用于其他语言。

- section: Abdrab | 课后练习
  items:
    - title: Sindarin Exercises
      zh: 辛达语课后练习
      url: /laim/sindarin.assets/Exercises/Exercises.html
      blurb: 包含音变练习、动词过去时练习和句子翻译练习。
    - title: Pronunciation Drill
      zh: 辛达语发音练习器
      url: /cerf/pronunciation/
      new: true
      blurb: 用站内真人录音做最小对立对听辨测验，覆盖全部单元音与双元音，答错自动重播对比音。
    - title: Vocabulary Review
      zh: 词汇间隔重复复习
      url: /cerf/review/
      new: true
      blurb: 基于 SM-2 间隔重复算法的辛达语词汇复习，进度与「巴别塔」爬塔游戏的掌握度共享同一份存档。

- section: Gell | 小游戏
  items:
    - title: Barad Bith · 巴别塔
      zh: 辛达语 roguelike 卡牌爬塔
      url: /laim/sindarin.assets/BaradBith/BaradBith.html
      blurb: 卡牌、敌人、圣物均取自辛达语词典的真实词条；获取新卡、开宝箱、参加事件时都会触发词义或音变小测验，答对即可掌握该词、解锁完整效果与释义，学习进度跨局永久保存。
    - title: Enya Panta-Tyalië · 中土自走棋
      zh: 中洲主题自走棋对战
      url: /gell/EPT/
      blurb: 购买中洲的英雄与魔物、凑齐种族与职业羁绊、三合一升星、锻造装备，在六边形棋盘上布阵对弈，活到最后即胜。支持单人模式（7 名性格各异的 AI + 本地段位排行榜）与 2~8 人在线联机（房号邀请，点对点直连）。
    - title: Ohtaheruvi · 中土战争领主
      zh: 精灵宝钻主题回合制战略
      url: /gell/Ohtaheruvi/
      new: true
      blurb: 以《精灵宝钻》为舞台的回合制战略：占领城市、生产并供养军队、派英雄探索上古遗迹寻找神器与盟友，用最多八个单位的军团逐城推进，控制全图三分之二的城市即胜。规则骨架取自 1989 年的 Warlords（含其 iPad 移植版的生产投送与报表设计）。含贝烈瑞安德（140×110，从贝烈瑞安德第一战到愤怒之战七场战役）与第三纪元中洲西北（160×120，魔戒战争等三场）两张战场，战争迷雾三档、AI 难度四档、移动可撤回、逐回合统计曲线与战史报表，并支持 2~8 人点对点联机。
    - title: Tharbeth
      zh: 辛达语填字游戏
      url: /laim/sindarin.assets/SindarinDatabase/Tharbeth.html
      blurb: 用汉语提示填出辛达语词条的填字游戏。
    - title: Sindarin Guess
      zh: 辛达语猜词
      url: /laim/sindarin.assets/SindarinDatabase/SindarinGuess.html
      blurb: 每日一词的辛达语猜词游戏。

- section: Thúnas | 造词灵感
  items:
    - title: Etymology Inspiration
      zh: 造词灵感工具
      url: /laim/etymology/Etymology.html
      blurb: 输入中文或英文单词，自动获取 Wiktionary 词源信息及多语言词源参考。
    - title: Name Forger
      zh: 中文名 → 辛达语名
      url: /cerf/name/
      new: true
      blurb: 按辛达语真实构词法与音变规则，从 558 条词典词条生成对应的辛达语名字，给出逐语素拆解、词源依据与腾格瓦写法。
    - title: Tengwar & Angerthas
      zh: 腾格瓦 / 色斯文转写器
      url: /cerf/tengwar/
      new: true
      blurb: 拉丁转写实时转换为腾格瓦（Tiwdi 模式）与安格尔沙斯卢恩文，可复制、可下载 SVG。

- section: 星图与地图
  items:
    - title: Star Map
      zh: 3D 交互星图
      url: /laim/stars.assets/
      blurb: 可拖动旋转天球、缩放并点击恒星查看详情的交互式星空。
    - title: Middle-earth Weather
      zh: 中洲实时天气
      url: /
      blurb: 首页导航栏右侧的天气挂件，点击可打开中洲地图并切换观测城市（程序化生成的区域性天气场）。
