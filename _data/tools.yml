# Single source of truth for the Cerf (工具) section — cerf.md renders from this.
# section: 分组标题（辛达语 | 中文）
# new: true 会显示 NEW 角标

- section: Gell | 小游戏
  items:
    - title: Barad Bith · 巴别塔
      zh: 辛达语 roguelike 卡牌爬塔
      url: /laim/sindarin.assets/BaradBith/BaradBith.html
      blurb: 用辛达语词条构成的 roguelike 卡牌爬塔，通过词义与音变小测验解锁卡牌效果，学习进度跨局保存。
    - title: Enya Panta-Tyalië · 中土自走棋
      zh: 中洲主题自走棋对战
      url: /gell/EPT/
      blurb: 招募中洲英雄与魔物，组合羁绊、升星锻造，在六边形棋盘上布阵。支持单人 AI 对战、本地段位榜与 2～8 人房号联机。
    - title: Ohtaheruvi · 中土战争领主
      zh: 精灵宝钻主题回合制战略
      url: /gell/Ohtaheruvi/
      new: true
      blurb: 《精灵宝钻》主题回合制战略：占领城市、组建军团、探索遗迹。含贝烈瑞安德与中洲西北战场，支持战争迷雾、多档 AI 和 2～8 人联机。
    - title: Gillíf · 星路争霸
      zh: 抢星星的即时战略
      url: /gell/Gillif/
      new: true
      blurb: 沿星路调兵夺星的即时战略，含六种星系、异常天体与能力卡组。支持 AI 对战、成长解锁、新手教程、同屏对战和房号组队联机。
    - title: Tharbeth
      zh: 辛达语填字游戏
      url: /laim/sindarin.assets/SindarinDatabase/Tharbeth.html
      blurb: 用汉语提示填出辛达语词条的填字游戏。
    - title: Sindarin Guess
      zh: 辛达语猜词
      url: /laim/sindarin.assets/SindarinDatabase/SindarinGuess.html
      blurb: 每日一词的辛达语猜词游戏。

- section: Qonlang | 千语集
  items:
    - title: Qonlang · 千语集
      zh: 给所有造语者的桌面工作台
      url: /cerf/qonlang/
      new: true
      blurb: 为造语者整理词汇、词根、音系与音变规则，支持自动标音、例句 gloss、自定义文字和词典导出。点击查看分模块使用指南。

- section: Qonsona | 语言学习
  items:
    - title: Qonsona
      zh: 日语与造语学习的桌面软件
      url: https://github.com/Kinnuch/Qonsona
      new: true
      blurb: 提供 JLPT N5～N1 日语词典、阅读、课程、生词本、间隔复习与模拟练习，也可导入 Qonlang 学习包。点击查看说明与下载。

- section: 背单词
  items:
    - title: Wordbank · 单词本
      zh: 离线背英语单词的手机应用
      url: /cerf/wordbank/
      new: true
      blurb: 支持导入词表、离线词典和多种题型，按间隔重复安排复习。数据保存在本机，可导出备份；手机添加到主屏幕后可离线使用。

- section: 旅行
  items:
    - title: Itinera · 行迹
      zh: 旅行行程规划与开销记账
      url: https://kinnuch.github.io/itinera/
      new: true
      blurb: 按天规划住宿、景点与交通，记录多币种开销并对照预算，检查行程冲突、生成路线图。支持手机离线使用与数据备份。

- section: Prestannath | 音变器
  items:
    - title: Shikrin SCA
      zh: 希克林语系音变器（网页版）
      url: /laim/shikrin.assets/SCA/SCA.html
      blurb: 内置「瑟乌丝林语」与「群岛希克林语」两种预设的 Category / Replace / Rule，也可自定义规则用于其他语言。

- section: Abdrab | 课后练习
  items:
    - title: Sindarin Exercises
      zh: 辛达语课后练习
      url: /laim/sindarin.assets/Exercises/Exercises.html
      blurb: 包含音变练习、动词过去时练习和句子翻译练习。
    - title: Pronunciation Drill
      zh: 辛达语发音练习器
      url: /cerf/pronunciation/
      new: true
      blurb: 用站内真人录音做最小对立对听辨测验，覆盖全部单元音与双元音，答错自动重播对比音。
    - title: Vocabulary Review
      zh: 词汇间隔重复复习
      url: /cerf/review/
      new: true
      blurb: 基于 SM-2 间隔重复算法的辛达语词汇复习，进度与「巴别塔」爬塔游戏的掌握度共享同一份存档。

- section: Thúnas | 造词灵感
  items:
    - title: Etymology Inspiration
      zh: 造词灵感工具
      url: /laim/etymology/Etymology.html
      blurb: 输入中文或英文单词，自动获取 Wiktionary 词源信息及多语言词源参考。
    - title: Name Forger
      zh: 中文名 → 辛达语名
      url: /cerf/name/
      new: true
      blurb: 按辛达语真实构词法与音变规则，从 558 条词典词条生成对应的辛达语名字，给出逐语素拆解、词源依据与腾格瓦写法。
    - title: Tengwar & Angerthas
      zh: 腾格瓦 / 色斯文转写器
      url: /cerf/tengwar/
      new: true
      blurb: 拉丁转写实时转换为腾格瓦（Tiwdi 模式）与安格尔沙斯卢恩文，可复制、可下载 SVG。

- section: 星图与地图
  items:
    - title: Star Map
      zh: 3D 交互星图
      url: /laim/stars.assets/
      blurb: 可拖动旋转天球、缩放并点击恒星查看详情的交互式星空。
    - title: Middle-earth Weather
      zh: 中洲实时天气
      url: /
      blurb: 首页导航栏右侧的天气挂件，点击可打开中洲地图并切换观测城市（程序化生成的区域性天气场）。
