<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
body { background: #2a2420; padding: 16px; font-family: sans-serif; }
h3 { color: #c9a227; margin: 14px 0 8px; font-size: 15px; }
.grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 10px; max-width: 1100px; }
.cell { text-align: center; }
.p { width: 96px; height: 96px; margin: auto; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
.p img { width: 90px; height: 90px; }
.n { color: #e8ddc4; font-size: 12px; margin-top: 3px; }
</style></head>
<body><div id="out"></div>
<script type="module">
import { UNITS } from './data/units.js';
const CC = { 1: '#9e9e9e', 2: '#66bb6a', 3: '#42a5f5', 4: '#ab47bc', 5: '#ffa726' };
const PHOTOS = new Set(['aragorn', 'feanor', 'fingolfin', 'frodo', 'galadriel', 'gandalf', 'glaurung', 'idril', 'legolas', 'merry', 'pippin', 'saruman', 'sauron', 'tuor', 'turin', 'witchking']);
const src = id => PHOTOS.has(id) ? `assets/photos/${id}.jpg` : `assets/portraits/${id}.svg`;
let html = '';
for (const cost of [1, 2, 3, 4, 5]) {
  html += `<h3>${cost} 费</h3><div class="grid">` + UNITS.filter(u => u.cost === cost).map(u =>
    `<div class="cell"><div class="p" style="background:linear-gradient(160deg,${CC[cost]}44,#00000055),#4a4038"><img style="${PHOTOS.has(u.id) ? 'border-radius:8px;object-fit:cover' : ''}" src="${src(u.id)}"></div><div class="n">${u.name}${PHOTOS.has(u.id) ? ' 📷' : ''}</div></div>`).join('') + '</div>';
}
document.getElementById('out').innerHTML = html;
</script></body></html>
